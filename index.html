<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>真心话大冒险</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14090f">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -10%,#3a1220 0%,#14090f 60%,#0b0508 100%);color:#f5e9d0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;overflow-x:hidden}
h1{font-size:2rem;letter-spacing:.15em;margin:10px 0 4px;color:#ffd76a;text-shadow:0 0 18px rgba(255,215,106,.5)}
.sub{color:#b98a5e;font-size:.85rem;letter-spacing:.3em;margin-bottom:22px}
.deck{width:100%;max-width:420px;min-height:300px;background:linear-gradient(160deg,#241019,#170a10);border:2px solid #8a5a2b;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;box-shadow:0 0 40px rgba(138,90,43,.35),inset 0 0 60px rgba(0,0,0,.5);margin-bottom:22px}
.deck::before{content:"🎲";font-size:3rem;margin-bottom:12px;filter:drop-shadow(0 0 10px rgba(255,215,106,.6))}
.deck.tag{font-size:.75rem;color:#ffd76a;border:1px solid #8a5a2b;border-radius:20px;padding:4px 14px;margin-bottom:14px;letter-spacing:.2em}
.deck.q{font-size:1.25rem;line-height:1.8;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center}
.deck.hint{color:#8a6a4a;font-size:.85rem;margin-top:10px}
.deck.shake{animation:shake.5s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-2deg) scale(.98)}40%{transform:rotate(2deg)}60%{transform:rotate(-1.5deg) scale(1.01)}80%{transform:rotate(1deg)}}
.btns{display:flex;gap:16px;width:100%;max-width:420px;margin-bottom:14px}
button{flex:1;border:none;border-radius:14px;padding:18px 0;font-size:1.2rem;font-weight:700;cursor:pointer;letter-spacing:.1em;transition:transform.1s}
button:active{transform:scale(.96)}
#truth{background:linear-gradient(135deg,#e0635a,#a83232);color:#fff;box-shadow:0 6px 20px rgba(224,99,90,.4)}
#dare{background:linear-gradient(135deg,#ffd76a,#e09a2b);color:#3a2200;box-shadow:0 6px 20px rgba(255,215,106,.35)}
.row{display:flex;gap:12px;width:100%;max-width:420px}
.row button{padding:12px 0;font-size:.95rem;font-weight:400}
#skip{background:rgba(255,255,255,.08);color:#c9a06a;border:1px solid #5a3a22}
#copy{background:rgba(255,215,106,.12);color:#ffd76a;border:1px solid #8a5a2b}
#skipCount{margin-top:16px;color:#8a6a4a;font-size:.8rem}
.toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(.8);background:#1d0f14;border:2px solid #ffd76a;color:#ffd76a;font-size:1.6rem;font-weight:700;padding:24px 40px;border-radius:16px;opacity:0;pointer-events:none;transition:all.25s;z-index:99;box-shadow:0 0 50px rgba(255,215,106,.4);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
footer{margin-top:auto;padding-top:30px;color:#5a4030;font-size:.75rem}
</style>
</head>
<body>
<h1>真心话大冒险</h1>
<div class="sub">酒 馆 夜 场 专 供</div>
<div class="deck" id="deck">
<div class="tag" id="tag">🎲 摇 骰 子 开 始</div>
<div class="q" id="q">选一个，愿赌服输</div>
<div class="hint" id="hint"></div>
</div>
<div class="btns">
<button id="truth">❤️ 真心话</button>
<button id="dare">🔥 大冒险</button>
</div>
<div class="row">
<button id="skip">跳过</button>
<button id="copy">复制题目</button>
</div>
<div id="skipCount"></div>
<div class="toast" id="toast">怂！</div>
<footer>喝酒不开车 · 玩归玩闹归闹</footer>
<script>
const TRUTH=[
"说出你手机里最见不得人的 APP",
"你暗恋过在场的人吗？是谁",
"上一次哭是什么时候？为什么",
"你做过最社死的一件事是什么",
"给前任打过分吗？几分",
"你撒过的最大的谎是什么",
"手机相册里最新的一张照片是什么，给大家看",
"你最尴尬的一次表白经历",
"说出你最讨厌在场某人的一个习惯（点名）",
"你存过前任的照片吗",
"你做过最抠门的一件事",
"你上厕所玩手机最长的一次是多久",
"你给父母的手机备注名是什么",
"你偷看过别人的手机吗",
"你说过最违心的一句夸奖是什么",
"你最后悔的一次冲动消费",
"你的择偶标准第一条是什么",
"你单身最长有多久",
"你收到过最奇葩的表白是什么样的",
"你考试作过弊吗？怎么作的",
"你最想删除的一条朋友圈是哪条",
"说出你对在场某人的第一印象（点名说）",
"你昨天微信步数是多少",
"你觉得在场谁最有可能先脱单",
"说出你最近一次说谎",
"你暗恋过老师吗",
"你做过最勇敢的一件事是什么",
"你借过钱没还吗",
"你手机里存了多少张自拍",
"如果只能带一个人去荒岛，你选在场的谁"
];
const DARE=[
"给通讯录第 3 个人打电话，说'我想你了'",
"用屁股写自己的名字，给大家看",
"大声朗读你最近一条暧昧聊天记录",
"做 10 个俯卧撑，边做边喊'我错了'",
"模仿在场的一个人，模仿到大家猜出来为止",
"吃一口芥末，不许皱眉",
"抱着枕头深情表白 30 秒",
"学公鸡打鸣三声",
"用脚夹笔在纸上写'我是猪'",
"对窗外大喊三声'我是大帅哥/大美女'",
"含一口水讲一个笑话，不许喷出来",
"给妈妈打电话说'我爱你'",
"跳一段科目三",
"用鼻子在手机上打字发一条朋友圈",
"扮演服务员给大家倒水，鞠躬说'客官请慢用'",
"大声唱《忐忑》高潮部分",
"和左边的人深情对视 10 秒",
"用方言念一段绕口令",
"现场给一个人捏肩捶背 1 分钟",
"模仿奥特曼变身动作并喊出台词",
"在朋友圈发'本人已疯，有事烧纸'，10 分钟不许删",
"用头顶着书走一圈",
"学三种动物叫声",
"给在场每个人一个真诚的夸奖",
"做鬼脸自拍发朋友圈",
"单腿站立背一首诗",
"现场深情表白空气 30 秒",
"用最小的声音说出你最大的秘密，再用最大的声音重复一遍",
"让在场的人在你脸上画一只乌龟",
"打电话给外卖小哥/快递小哥说一声谢谢"
];
const $=id=>document.getElementById(id);
let cur=null,curType=null,skips=0;
function draw(type){
const pool=type==='truth'?TRUTH:DARE;
const deck=$('deck');
deck.classList.remove('shake');void deck.offsetWidth;deck.classList.add('shake');
let n=0;
const iv=setInterval(()=>{
$('q').textContent=pool[Math.floor(Math.random()*pool.length)];
if(++n>=12){
clearInterval(iv);
cur=$('q').textContent;curType=type;
$('tag').textContent=type==='truth'?'❤️ 真 心 话':'🔥 大 冒 险';
$('hint').textContent='第 '+($('tag').textContent.includes('真')?TRUTH.indexOf(cur)+1:DARE.indexOf(cur)+1)+' 题';
}
},70);
}
$('truth').onclick=()=>draw('truth');
$('dare').onclick=()=>draw('dare');
$('skip').onclick=()=>{
if(!cur)return;
skips++;
$('skipCount').textContent='已跳过 '+skips+' 次';
if(skips%3===0){
const t=$('toast');
t.textContent=['怂！','又怂了！','怂出天际了！'][(skips/3-1)%3|0];
t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);
}
draw(curType);
};
$('copy').onclick=()=>{
if(!cur)return;
navigator.clipboard.writeText(''+cur).then(()=>{
const b=$('copy');b.textContent='已复制 ✓';setTimeout(()=>b.textContent='复制题目',1200);
});
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
